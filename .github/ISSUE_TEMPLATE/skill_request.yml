name: Skill idea
description: Suggest a new skill for designers, developers, SEO teams or agencies
labels: [skill-request]
body:
  - type: dropdown
    id: team
    attributes:
      label: Who is it for?
      multiple: true
      options:
        - Designers
        - Developers
        - SEO team
        - Agency owners / project managers
        - Everyone
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: What job should it do from start to finish?
      description: "Describe the real task, e.g. \"turn a client's old WordPress site into a redirect map before migrating to Webflow\"."
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How would we know it did the job well?
      description: What should it check or show as proof? This becomes the skill's test.
  - type: textarea
    id: tools
    attributes:
      label: Tools or connectors it would use
      placeholder: Figma, Webflow, Search Console, Ahrefs…
