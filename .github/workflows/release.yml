name: Release

# Push a tag like v0.1.0 to publish a GitHub release with ZIP files for Claude app users.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check everything first
        run: |
          node scripts/sync-shared.mjs --check
          node scripts/validate.mjs
          node --test "tests/**/*.test.mjs"
      - name: Build ZIPs
        run: node scripts/build-zips.mjs
      - name: Write release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md \
            | sed "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/#g" > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no '## $VER' section"; exit 1; fi
          cat >> notes.md <<EOF

          ### Install

          **Claude Code:** ask Claude to "install the Power-Up Kit from https://github.com/$GITHUB_REPOSITORY" — it asks your role and installs it. Or run \`claude plugin install power-up-kit --marketplace $GITHUB_REPOSITORY\` (role bundles: \`power-up-designers\`, \`power-up-developers\`, \`power-up-seo-team\`).

          **Claude app (claude.ai, desktop chat):** left sidebar **Customize** → **Plugins** → **Add** → **Add marketplace** → paste \`$GITHUB_REPOSITORY\` → **Discover** → **Add** \`powerup-core\` and the packs for your role. [Step by step](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/claude-app.md#install-once-about-2-minutes). Can't add marketplaces? Upload the pack ZIPs below under **Customize → Plugins → Add → Upload plugin**.

          Already installed? Run \`/plugin\` → Marketplaces → power-up-kit → Update, then restart Claude Code.
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/plugins/*.zip dist/skills/*.zip \
            --title "Power-Up Kit $GITHUB_REF_NAME" \
            --notes-file notes.md
